[package]
name = "ilovenoise"
version = "0.4.3"
edition = "2024"
description = "Simple image noise generator"
license = "MIT"
repository = "https://github.com/r41ngee/ilovenoise"
readme = "README.md"
exclude = [".github"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.7"
png = "0.18.1"
rand = "0.10.1"
rand_chacha = "0.10.0"

ilovenoise-core = { path = "../ilovenoise-core", features = ["tasking"] , version = "^0.4.1" }
rayon = "1.12.0"
anyhow = "1"

[build-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.5"